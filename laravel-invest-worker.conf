; ═══════════════════════════════════════════════════════════════
; TradingV2 — Unified bar consumer + gate-check queue workers
; Replaces all 18 per-pipeline bar-events-{a-q} programs.
; ═══════════════════════════════════════════════════════════════

[program:laravel-invest-tradingv2-consumer]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/laravel-invest/artisan trading:consume-bars --group=scanner --consumer=scanner-%(process_num)02d --batch=200
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=3
user=pnovack
environment=PATH="/var/www/html/laravel-invest/.venv/bin:/usr/local/bin:/usr/bin:/bin",HOME="/var/www/html"
redirect_stderr=true
stdout_logfile=/var/www/html/laravel-invest/storage/logs/tradingv2-consumer.log
stopwaitsecs=15

[program:laravel-invest-tradingv2-workers]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/laravel-invest/artisan queue:work redis --queue=gate-check --sleep=0 --tries=1 --max-time=300
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=18
user=pnovack
environment=PATH="/var/www/html/laravel-invest/.venv/bin:/usr/local/bin:/usr/bin:/bin",HOME="/var/www/html"
redirect_stderr=true
stdout_logfile=/var/www/html/laravel-invest/storage/logs/tradingv2-worker.log
stopwaitsecs=3600


[program:laravel-invest-candlestick-screener]
process_name=%(program_name)s
command=/var/www/html/laravel-invest/.venv/bin/python /var/www/html/laravel-invest/candlestick-screener/app.py
directory=/var/www/html/laravel-invest/candlestick-screener
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=pnovack
numprocs=1
environment=PATH="/var/www/html/laravel-invest/.venv/bin:/usr/local/bin:/usr/bin:/bin",HOME="/var/www/html",FLASK_APP=app.py,FLASK_RUN_HOST=0.0.0.0,FLASK_RUN_PORT=5000
redirect_stderr=true
stdout_logfile=/var/www/html/laravel-invest/storage/logs/candlestick-screener.log
stopwaitsecs=10