[program:laravel-invest-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/laravel-invest/artisan queue:work redis --sleep=1 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=pnovack
numprocs=7
environment=PATH="/var/www/html/laravel-invest/.venv/bin:/usr/local/bin:/usr/bin:/bin",HOME="/var/www/html"
redirect_stderr=true
stdout_logfile=/var/www/html/laravel-invest/storage/logs/worker.log
stopwaitsecs=3600

